<style>
.clay {
  position: relative;
  height: clamp(460px, 74vh, 760px);
  margin-top: clamp(24px, 4vh, 56px);
  cursor: grab;
  touch-action: pan-y;
  user-select: none;
}
.clay.dragging { cursor: grabbing; }
@media (max-width: 760px) { .clay { height: 62vh; } }
.clay canvas { display: block; width: 100%; height: 100%; }
/* Without WebGL: the screens in a plain row. */
.clay.flat { display: flex; gap: 16px; overflow-x: auto; padding: 0 var(--gutter); height: auto; cursor: auto; }
.clay.flat .phone { width: 180px; flex: none; }
.orbit-cap { margin: 0 auto; padding: 0 var(--gutter); max-width: 30em; min-height: 4.5em; text-align: center; font-size: clamp(15px, 1.15vw, 17px); transition: opacity .25s; }
</style>
</head>

  </div>

  <p class="orbit-cap cap" aria-live="polite"></p>
</section>

<script src="/lab/screens.js"></script>
<script>
  // The clay phones show the bare screens, cut from the mockups.
  window.SCREENS.forEach((s, i) => { s.flat = s.src; s.src = `/assets/screens/screen-flat-${String(i + 1).padStart(2, "0")}.webp`; });
</script>

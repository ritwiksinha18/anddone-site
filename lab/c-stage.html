<title>Lab · Pinned stage</title>

<link rel="stylesheet" href="/lab/lab.css">
<style>
/* Apple's pinned stage: the section holds the screen while you scroll
   through it. One phone stands in the middle and changes screen at each
   step; the words on the left change with it, a counter on the right keeps
   count. Scrolling is the only control. */
.stage { position: relative; height: calc(9 * 72vh + 100vh); margin-top: clamp(40px, 6vh, 80px); }
.pin {
  position: sticky; top: 0; height: 100vh; height: 100svh;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  gap: clamp(24px, 5vw, 88px); padding: 0 var(--gutter);
}
.words { position: relative; justify-self: end; width: min(400px, 100%); height: 14em; }
.word { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; opacity: 0; transform: translateY(18px); transition: opacity .5s, transform .6s cubic-bezier(.2,.75,.2,1); }
.word.on { opacity: 1; transform: none; }
.word.past { transform: translateY(-18px); }
.word .n { font-family: var(--expanded); font-stretch: 125%; font-weight: 500; font-size: 10.5px; letter-spacing: .16em; color: #86868b; }
.word h3 { margin: 12px 0 0; font-family: var(--expanded); font-stretch: 125%; font-weight: 700; font-size: clamp(22px, 2.3vw, 34px); line-height: 1.05; text-transform: uppercase; letter-spacing: -.01em; color: #1d1d1f; }
.word p { margin: 14px 0 0; font-size: clamp(15px, 1.15vw, 17px); }
.device { position: relative; height: min(78vh, 700px); aspect-ratio: 578 / 1200; }
.device .phone { position: absolute; inset: 0; height: 100%; width: 100%; opacity: 0; transform: translateY(5%) scale(.96); transition: opacity .55s, transform .7s cubic-bezier(.2,.75,.2,1); }
.device .phone.on { opacity: 1; transform: none; }
.device .phone.past { transform: translateY(-5%) scale(.96); }
.ticks { justify-self: start; display: grid; gap: 10px; }
.ticks i { display: block; width: 22px; height: 2px; border-radius: 2px; background: rgba(0,0,0,.12); transition: width .4s, background .4s; }
.ticks i.on { width: 44px; background: #1d1d1f; }
@media (max-width: 860px) {
  .pin { grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: center; gap: 18px; }
  .device { height: 58vh; justify-self: center; }
  .words { justify-self: center; height: 9.5em; text-align: center; }
  .word h3 { font-size: 20px; }
  .ticks { display: none; }
}
</style>
</head>
<body class="landing lab">
<nav class="lab-bar"><span>And Done · showcase lab</span><a href="/lab/a-wave.html">1 Wave wall</a><a href="/lab/b-deck.html">2 Deck</a><a href="/lab/c-stage.html" aria-current="page">3 Pinned stage</a><a href="/lab/d-orbit.html">4 Orbit</a><a href="/lab/e-clay.html">5 Clay orbit</a></nav>

<section class="lab-section" style="padding-bottom:0;overflow:visible">
  <div class="lab-head">
    <h2>Made on your iPhone.</h2>
    <p>Scroll through nine of the fifteen designs, each drawn from a real workout.</p>
  </div>
  <div class="stage">
    <div class="pin">
      <div class="words"></div>
      <div class="device"></div>
      <div class="ticks" aria-hidden="true"></div>
    </div>
  </div>
</section>
<section class="lab-section"><p class="lab-head cap">The rest of the page continues here.</p></section>

<script src="/lab/screens.js"></script>
<script>
(function () {
  const S = window.SCREENS, n = S.length;
  const stage = document.querySelector(".stage");
  const words = document.querySelector(".words"), device = document.querySelector(".device"), ticks = document.querySelector(".ticks");
  const W = S.map((s, i) => {
    const w = document.createElement("div");
    w.className = "word cap";
    w.innerHTML = `<span class="n">${String(i + 1).padStart(2, "0")} / ${String(n).padStart(2, "0")}</span><h3>${s.lead}</h3><p>${s.body}</p>`;
    words.appendChild(w); return w;
  });
  const P = S.map((s, i) => {
    const im = document.createElement("img");
    im.className = "phone"; im.src = s.src; im.alt = s.alt; im.decoding = "async";
    if (i > 1) im.loading = "lazy";
    device.appendChild(im); return im;
  });
  const T = S.map(() => ticks.appendChild(document.createElement("i")));
  let current = -1;
  function update() {
    const r = stage.getBoundingClientRect();
    const span = r.height - innerHeight;
    const p = Math.min(Math.max(-r.top / span, 0), 0.9999);
    const i = Math.floor(p * n);
    if (i === current) return;
    current = i;
    [W, P, T].forEach((set) => set.forEach((el, k) => {
      el.classList.toggle("on", k === i);
      el.classList.toggle("past", k < i);
    }));
  }
  addEventListener("scroll", update, { passive: true });
  addEventListener("resize", update);
  update();
})();
</script>
</body>
